apiVersion: v1
kind: Namespace
metadata:
  name: traffic-lab
---
# 1. Version 1 (Stable / Blue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-v1
  namespace: traffic-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
      version: v1
  template:
    metadata:
      labels:
        app: payments
        version: v1
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=--- [PAYMENTS SERVICE v1.0.0] (Stable Production) ---\n"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v1-svc
  namespace: traffic-lab
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"8080":{}}}'
spec:
  type: ClusterIP
  selector:
    app: payments
    version: v1
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# 2. Version 2 (Canary / Green)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-v2
  namespace: traffic-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
      version: v2
  template:
    metadata:
      labels:
        app: payments
        version: v2
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=*** [PAYMENTS SERVICE v2.0.0] (Canary / New Release) ***\n"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v2-svc
  namespace: traffic-lab
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"8080":{}}}'
spec:
  type: ClusterIP
  selector:
    app: payments
    version: v2
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# 3. ReferenceGrant allowing gateway-infra to route to traffic-lab
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-traffic
  namespace: traffic-lab
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: gateway-infra
  to:
  - group: ""
    kind: Service

