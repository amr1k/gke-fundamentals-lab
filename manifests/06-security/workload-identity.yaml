apiVersion: v1
kind: Namespace
metadata:
  name: backend-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-ksa
  namespace: backend-app
  annotations:
    iam.gke.io/gcp-service-account: gke-storage-reader@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-identity-test
  namespace: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-identity-test
  template:
    metadata:
      labels:
        app: workload-identity-test
    spec:
      serviceAccountName: backend-ksa
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: cloud-sdk
          image: google/cloud-sdk:slim
          command:
            - sleep
            - "36000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metadata-and-dns
  namespace: backend-app
spec:
  podSelector:
    matchLabels:
      app: workload-identity-test
  policyTypes:
    - Egress
  egress:
    # 1. Allow cluster DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow communication to GKE Metadata Server (169.254.169.254:80)
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    # 3. Allow outbound HTTPS to Google Cloud APIs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
